<head>
<meta charset="UTF-8">

<title>Enovar Product Verification</title>
<style>
  :root {
    --enovar-green: #1f8a52;
    --bg: #f4f7f5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  .logo {
    max-width: 300px;
    width: 100%;
    height: auto;
    margin: 0 auto 28px;
    display: block;
  }
  .check {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: var(--enovar-green);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check svg { width: 36px; height: 36px; }
  h1 {
    font-size: 22px;
    color: var(--enovar-green);
  }
</style>
